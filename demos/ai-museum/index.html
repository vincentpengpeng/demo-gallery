<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>东莞市博物馆 · AI 数字人导览</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
  body {
    min-height: 100vh;
    display: flex; flex-direction: column;
    background: #1a1a1a;
  }

  /* ===== 全屏背景 ===== */
  .bg-wrap {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    z-index: 0;
    background: #1a1a2a url('bg-digital-human.png') center 30% / cover no-repeat;
  }
  .bg-wrap::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: linear-gradient(to bottom,
      rgba(0,0,0,0.10) 0%,
      rgba(0,0,0,0.20) 25%,
      rgba(0,0,0,0.45) 50%,
      rgba(0,0,0,0.65) 70%,
      rgba(0,0,0,0.80) 100%
    );
  }

  /* ===== 顶部导航 ===== */
  .topbar {
    position: relative; z-index: 2;
    display: flex; justify-content: space-between; align-items: center;
    padding: 16px 32px;
    flex-shrink: 0;
  }
  .topbar .brand {
    display: flex; align-items: center; gap: 10px;
  }
  .topbar .brand .logo {
    width: 36px; height: 36px;
    background: linear-gradient(135deg, #c99a6a, #a87d52);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 15px; color: #fff;
  }
  .topbar .brand .name {
    font-size: 16px; font-weight: 600; color: #ffffff;
    text-shadow: 0 1px 6px rgba(0,0,0,0.3);
  }
  .topbar .brand .sub {
    font-size: 11px; color: rgba(255,255,255,0.5); margin-left: 4px;
  }
  .topbar .btn-backend {
    padding: 8px 18px;
    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 20px;
    color: rgba(255,255,255,0.8);
    font-size: 13px; cursor: pointer;
    font-family: inherit; transition: all 0.2s;
  }
  .topbar .btn-backend:hover {
    background: rgba(255,255,255,0.2);
    color: #fff;
  }

  /* ===== 主内容 ===== */
  .main-content {
    position: relative; z-index: 2;
    flex: 1;
    display: flex; flex-direction: column;
    justify-content: flex-end;
    padding: 0 32px 24px;
    max-width: 800px;
    margin: 0 auto;
    width: 100%;
  }

  /* ===== 标题 ===== */
  .hero-title {
    margin-bottom: 20px;
  }
  .hero-title h1 {
    font-size: 28px; font-weight: 700; color: #ffffff;
    text-shadow: 0 2px 12px rgba(0,0,0,0.3);
  }
  .hero-title p {
    font-size: 14px; color: rgba(255,255,255,0.6);
    margin-top: 4px;
    text-shadow: 0 1px 6px rgba(0,0,0,0.2);
  }

  /* ===== 快捷问题 ===== */
  .quick-qs {
    display: flex; flex-wrap: wrap; gap: 8px;
    margin-bottom: 16px;
  }
  .quick-qs .q {
    padding: 8px 18px;
    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 20px;
    color: rgba(255,255,255,0.85);
    font-size: 13px; cursor: pointer;
    transition: all 0.2s; font-family: inherit;
    white-space: nowrap;
  }
  .quick-qs .q:hover {
    background: rgba(255,255,255,0.22);
    border-color: rgba(255,255,255,0.4);
  }

  /* ===== 对话区域 ===== */
  .chat-area {
    max-height: 320px;
    overflow-y: auto;
    padding: 8px 4px 12px 0;
    margin-bottom: 12px;
  }
  .chat-area::-webkit-scrollbar { width: 4px; }
  .chat-area::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 2px; }

  .msg {
    display: flex; gap: 10px;
    margin-bottom: 14px;
    animation: fadeIn 0.3s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  .msg.user { flex-direction: row-reverse; }
  .msg .av {
    width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px;
  }
  .msg.bot .av {
    background: rgba(201,154,106,0.7);
    backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.15);
  }
  .msg.user .av {
    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.15);
  }
  .msg .bubble {
    max-width: 75%;
    padding: 10px 16px;
    border-radius: 16px;
    font-size: 14px; line-height: 1.6;
  }
  .msg.bot .bubble {
    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,0.1);
    color: #ffffff;
    border-bottom-left-radius: 4px;
  }
  .msg.bot .bubble b { color: #f0d0b0; }
  .msg.user .bubble {
    background: rgba(201,154,106,0.6);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.1);
    color: #fff;
    border-bottom-right-radius: 4px;
  }

  .welcome-msg {
    text-align: center; padding: 8px 0;
  }
  .welcome-msg .greeting {
    font-size: 16px; font-weight: 600; color: #ffffff;
    text-shadow: 0 1px 8px rgba(0,0,0,0.3);
  }
  .welcome-msg .hint {
    font-size: 13px; color: rgba(255,255,255,0.5); margin-top: 4px;
  }

  /* ===== 输入框 ===== */
  .input-bar {
    display: flex; gap: 8px;
    background: rgba(255,255,255,0.10);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 24px;
    padding: 6px 6px 6px 18px;
  }
  .input-bar input {
    flex: 1; border: none; background: none;
    font-size: 14px; color: #ffffff; outline: none;
    font-family: inherit;
  }
  .input-bar input::placeholder { color: rgba(255,255,255,0.3); }
  .input-bar .send {
    width: 36px; height: 36px; border-radius: 50%;
    background: linear-gradient(135deg, #c99a6a, #b8845a);
    border: none; color: #fff; font-size: 16px;
    cursor: pointer; flex-shrink: 0;
  }

  /* ===== 策展后台弹窗 ===== */
  .backend-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: #f5f4f0;
    z-index: 100;
    display: none;
    flex-direction: column;
    overflow: hidden;
    animation: slideIn 0.3s ease;
  }
  @keyframes slideIn { from { opacity: 0; } to { opacity: 1; } }
  .backend-overlay.open { display: flex; }

  .backend-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 24px;
    background: #ffffff;
    border-bottom: 1px solid #e8e6e0;
  }
  .backend-header .bh-title {
    font-size: 15px; font-weight: 600; color: #1a1a1a;
  }
  .backend-header .bh-close {
    padding: 6px 16px;
    border: 1px solid #e0deda; border-radius: 8px;
    background: #fff; color: #6a6a6a; cursor: pointer;
    font-size: 13px; font-family: inherit;
  }
  .backend-header .bh-close:hover { background: #f5f4f0; }

  .backend-iframe {
    flex: 1; border: none; width: 100%;
  }

  @media (max-width: 600px) {
    .topbar { padding: 12px 16px; }
    .main-content { padding: 0 16px 16px; }
    .hero-title h1 { font-size: 22px; }
    .quick-qs .q { font-size: 12px; padding: 6px 14px; }
    .msg .bubble { font-size: 13px; max-width: 85%; }
    .chat-area { max-height: 240px; }
  }
</style>
</head>
<body>

<!-- 背景 -->
<div class="bg-wrap"></div>

<!-- 顶部导航 -->
<div class="topbar">
  <div class="brand">
    <div class="logo">AI</div>
    <div>
      <span class="name">东莞市博物馆</span>
      <span class="sub">AI 数字人导览</span>
    </div>
  </div>
  <button class="btn-backend" onclick="openBackend()">⚙️ 进入策展后台</button>
</div>

<!-- 主内容 -->
<div class="main-content">

  <div class="hero-title">
    <h1>您好，欢迎来到东莞市博物馆</h1>
    <p>我是 AI 导览助手，有什么可以帮您的？</p>
  </div>

  <!-- 快捷问题 -->
  <div class="quick-qs" id="quickQs">
    <span class="q" onclick="ask('镇馆之宝是什么？')">镇馆之宝是什么？</span>
    <span class="q" onclick="ask('今天开门吗？')">今天开门吗？</span>
    <span class="q" onclick="ask('门票怎么预约？')">门票怎么预约？</span>
    <span class="q" onclick="ask('有免费讲解吗？')">有免费讲解吗？</span>
    <span class="q" onclick="ask('能拍照吗？')">能拍照吗？</span>
  </div>

  <!-- 对话区域 -->
  <div class="chat-area" id="chatArea">
    <div class="welcome-msg" id="welcomeMsg">
      <div class="greeting">👋 点击上方问题或直接输入</div>
      <div class="hint">我会为您解答博物馆参观的各类问题</div>
    </div>
  </div>

  <!-- 输入框 -->
  <div class="input-bar">
    <input type="text" id="chatInput" placeholder="输入您的问题..." onkeydown="if(event.key==='Enter')sendChat()">
    <button class="send" onclick="sendChat()">↵</button>
  </div>

</div>

<!-- ===== 策展后台弹窗 ===== -->
<div class="backend-overlay" id="backendOverlay">
  <div class="backend-header">
    <span class="bh-title">AI 博物馆 · 智能策展系统</span>
    <button class="bh-close" onclick="closeBackend()">✕ 返回导览</button>
  </div>
  <iframe class="backend-iframe" id="backendIframe"></iframe>
</div>

<script>
  var answers = {};
  answers['镇馆之宝是什么？'] = '东莞市博物馆馆藏精品众多，最受关注的镇馆之宝包括：<b>明万历青花龙纹瓷碗</b>——釉色莹润、龙纹威武，是明代官窑瓷器代表作；<b>清康熙五彩人物故事瓶</b>——色彩艳丽、画工精湛；以及<b>东汉陶俑</b>——造型生动，反映汉代岭南生活风貌。';
  answers['今天开门吗？'] = '东莞市博物馆开放时间为：<b>周二至周日 9:00-17:00</b>（16:00停止入馆），<b>周一闭馆</b>（法定节假日除外）。建议关注官方公众号获取最新安排。';
  answers['门票怎么预约？'] = '东莞市博物馆<b>免费开放</b>，需提前预约。<br>1\uFE0F\u20E3 关注「东莞市博物馆」微信公众号预约<br>2\uFE0F\u20E3 微信小程序搜索「东莞市博物馆预约」<br>3\uFE0F\u20E3 现场凭身份证登记（建议提前预约）';
  answers['有免费讲解吗？'] = '有的！每天提供<b>免费定时讲解</b>，上午 10:00 和下午 15:00 各一场。也可租用<b>语音导览器</b>或扫描展品旁二维码收听讲解。';
  answers['能拍照吗？'] = '展厅内<b>可以拍照</b>，但请<b>不要使用闪光灯</b>以免损伤文物。部分特展可能有特殊规定，请留意现场标识。';

  var chatArea = document.getElementById('chatArea');
  var chatInput = document.getElementById('chatInput');

  function addMsg(text, role) {
    var welcome = document.getElementById('welcomeMsg');
    if (welcome) welcome.style.display = 'none';
    var div = document.createElement('div');
    div.className = 'msg ' + role;
    var av = document.createElement('div');
    av.className = 'av';
    av.textContent = role === 'bot' ? '🤖' : '👤';
    var bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = text;
    div.appendChild(av);
    div.appendChild(bubble);
    chatArea.appendChild(div);
    chatArea.scrollTop = chatArea.scrollHeight;
  }

  function ask(q) {
    addMsg(q, 'user');
    var a = answers[q];
    if (!a) a = '抱歉，我还在学习中～请试试其他问题。';
    setTimeout(function() { addMsg(a, 'bot'); }, 400);
  }

  function sendChat() {
    var text = chatInput.value.trim();
    if (!text) return;
    var matched = null;
    for (var key in answers) {
      if (text.indexOf(key.substr(0, 4)) !== -1) { matched = key; break; }
    }
    addMsg(text, 'user');
    var reply = matched ? answers[matched] : '抱歉，我还在学习中～您可以试试点击上方常见问题，或换个方式问我哦！';
    setTimeout(function() { addMsg(reply, 'bot'); }, 400);
    chatInput.value = '';
  }

  function openBackend() {
    var overlay = document.getElementById('backendOverlay');
    var iframe = document.getElementById('backendIframe');
    overlay.classList.add('open');
    iframe.src = 'backend.html';
  }

  function closeBackend() {
    var overlay = document.getElementById('backendOverlay');
    var iframe = document.getElementById('backendIframe');
    overlay.classList.remove('open');
    iframe.src = '';
  }
</script>
</body>
</html>

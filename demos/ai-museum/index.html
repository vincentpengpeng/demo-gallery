<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>东莞市博物馆 · AI 数字人导览</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
  body {
    min-height: 100vh;
    display: flex; flex-direction: column;
    background: #1a1a1a;
  }

  /* ===== 全屏背景 ===== */
  .bg-wrap {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    z-index: 0;
    background: #1a1a2a url('bg-digital-human.png') center 30% / cover no-repeat;
  }
  .bg-wrap::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: linear-gradient(to bottom,
      rgba(0,0,0,0.10) 0%,
      rgba(0,0,0,0.20) 25%,
      rgba(0,0,0,0.45) 50%,
      rgba(0,0,0,0.65) 70%,
      rgba(0,0,0,0.80) 100%
    );
  }

  /* ===== 顶部导航 ===== */
  .topbar {
    position: relative; z-index: 2;
    display: flex; justify-content: space-between; align-items: center;
    padding: 16px 32px;
    flex-shrink: 0;
  }
  .topbar .brand {
    display: flex; align-items: center; gap: 10px;
  }
  .topbar .brand .logo {
    width: 36px; height: 36px;
    background: linear-gradient(135deg, #c99a6a, #a87d52);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 15px; color: #fff;
  }
  .topbar .brand .name {
    font-size: 16px; font-weight: 600; color: #ffffff;
    text-shadow: 0 1px 6px rgba(0,0,0,0.3);
  }
  .topbar .brand .sub {
    font-size: 11px; color: rgba(255,255,255,0.5); margin-left: 4px;
  }
  .topbar .btn-backend {
    padding: 8px 18px;
    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 20px;
    color: rgba(255,255,255,0.8);
    font-size: 13px; cursor: pointer;
    font-family: inherit; transition: all 0.2s;
  }
  .topbar .btn-backend:hover {
    background: rgba(255,255,255,0.2);
    color: #fff;
  }

  /* ===== 主内容 ===== */
  .main-content {
    position: relative; z-index: 2;
    flex: 1;
    display: flex; flex-direction: column;
    justify-content: flex-end;
    padding: 0 32px 24px;
    max-width: 800px;
    margin: 0 auto;
    width: 100%;
  }

  /* ===== 标题 ===== */
  .hero-title {
    margin-bottom: 20px;
  }
  .hero-title h1 {
    font-size: 28px; font-weight: 700; color: #ffffff;
    text-shadow: 0 2px 12px rgba(0,0,0,0.3);
  }
  .hero-title p {
    font-size: 14px; color: rgba(255,255,255,0.6);
    margin-top: 4px;
    text-shadow: 0 1px 6px rgba(0,0,0,0.2);
  }

  /* ===== 快捷问题 ===== */
  .quick-qs {
    display: flex; flex-wrap: wrap; gap: 8px;
    margin-bottom: 16px;
  }
  .quick-qs .q {
    padding: 8px 18px;
    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 20px;
    color: rgba(255,255,255,0.85);
    font-size: 13px; cursor: pointer;
    transition: all 0.2s; font-family: inherit;
    white-space: nowrap;
  }
  .quick-qs .q:hover {
    background: rgba(255,255,255,0.22);
    border-color: rgba(255,255,255,0.4);
  }

  /* ===== 对话区域 ===== */
  .chat-area {
    max-height: 320px;
    overflow-y: auto;
    padding: 8px 4px 12px 0;
    margin-bottom: 12px;
  }
  .chat-area::-webkit-scrollbar { width: 4px; }
  .chat-area::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 2px; }

  .msg {
    display: flex; gap: 10px;
    margin-bottom: 14px;
    animation: fadeIn 0.3s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  .msg.user { flex-direction: row-reverse; }
  .msg .av {
    width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px;
  }
  .msg.bot .av {
    background: rgba(201,154,106,0.7);
    backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.15);
  }
  .msg.user .av {
    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.15);
  }
  .msg .bubble {
    max-width: 75%;
    padding: 10px 16px;
    border-radius: 16px;
    font-size: 14px; line-height: 1.6;
  }
  .msg.bot .bubble {
    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,0.1);
    color: #ffffff;
    border-bottom-left-radius: 4px;
  }
  .msg.bot .bubble b { color: #f0d0b0; }
  .msg.user .bubble {
    background: rgba(201,154,106,0.6);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.1);
    color: #fff;
    border-bottom-right-radius: 4px;
  }

  .welcome-msg {
    text-align: center; padding: 8px 0;
  }
  .welcome-msg .greeting {
    font-size: 16px; font-weight: 600; color: #ffffff;
    text-shadow: 0 1px 8px rgba(0,0,0,0.3);
  }
  .welcome-msg .hint {
    font-size: 13px; color: rgba(255,255,255,0.5); margin-top: 4px;
  }

  /* ===== 输入框 ===== */
  .input-bar {
    display: flex; gap: 8px;
    background: rgba(255,255,255,0.10);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 24px;
    padding: 6px 6px 6px 18px;
  }
  .input-bar input {
    flex: 1; border: none; background: none;
    font-size: 14px; color: #ffffff; outline: none;
    font-family: inherit;
  }
  .input-bar input::placeholder { color: rgba(255,255,255,0.3); }
  .input-bar .send {
    width: 36px; height: 36px; border-radius: 50%;
    background: linear-gradient(135deg, #c99a6a, #b8845a);
    border: none; color: #fff; font-size: 16px;
    cursor: pointer; flex-shrink: 0;
  }

  /* ===== 策展后台弹窗 ===== */
  .backend-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: #f5f4f0;
    z-index: 100;
    display: none;
    flex-direction: column;
    overflow: hidden;
    animation: slideIn 0.3s ease;
  }
  @keyframes slideIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes dotPulse { 0%,60%,100% { transform: translateY(0); opacity: 0.4; } 30% { transform: translateY(-4px); opacity: 1; } }
  .backend-overlay.open { display: flex; }

  .backend-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 24px;
    background: #ffffff;
    border-bottom: 1px solid #e8e6e0;
  }
  .backend-header .bh-title {
    font-size: 15px; font-weight: 600; color: #1a1a1a;
  }
  .backend-header .bh-close {
    padding: 6px 16px;
    border: 1px solid #e0deda; border-radius: 8px;
    background: #fff; color: #6a6a6a; cursor: pointer;
    font-size: 13px; font-family: inherit;
  }
  .backend-header .bh-close:hover { background: #f5f4f0; }

  .backend-iframe {
    flex: 1; border: none; width: 100%;
  }

  @media (max-width: 600px) {
    .topbar { padding: 12px 16px; }
    .main-content { padding: 0 16px 16px; }
    .hero-title h1 { font-size: 22px; }
    .quick-qs .q { font-size: 12px; padding: 6px 14px; }
    .msg .bubble { font-size: 13px; max-width: 85%; }
    .chat-area { max-height: 240px; }
  }
</style>
</head>
<body>

<!-- 背景 -->
<div class="bg-wrap"></div>

<!-- 顶部导航 -->
<div class="topbar">
  <div class="brand">
    <div class="logo">AI</div>
    <div>
      <span class="name">东莞市博物馆</span>
      <span class="sub">AI 数字人导览</span>
    </div>
  </div>
  <button class="btn-backend" onclick="openBackend()">⚙️ 进入策展后台</button>
</div>

<!-- 主内容 -->
<div class="main-content">

  <div class="hero-title">
    <h1>您好，欢迎来到东莞市博物馆</h1>
    <p>我是 AI 导览助手，有什么可以帮您的？</p>
  </div>

  <!-- 快捷问题 -->
  <div class="quick-qs" id="quickQs">
    <span class="q" onclick="ask('镇馆之宝是什么？')">镇馆之宝是什么？</span>
    <span class="q" onclick="ask('今天开门吗？')">今天开门吗？</span>
    <span class="q" onclick="ask('门票怎么预约？')">门票怎么预约？</span>
    <span class="q" onclick="ask('有免费讲解吗？')">有免费讲解吗？</span>
    <span class="q" onclick="ask('能拍照吗？')">能拍照吗？</span>
  </div>

  <!-- 对话区域 -->
  <div class="chat-area" id="chatArea">
    <div class="welcome-msg" id="welcomeMsg">
      <div class="greeting">👋 点击上方问题或直接输入</div>
      <div class="hint">我会为您解答博物馆参观的各类问题</div>
    </div>
  </div>

  <!-- 输入框 -->
  <div class="input-bar">
    <input type="text" id="chatInput" placeholder="输入您的问题..." onkeydown="if(event.key==='Enter')sendChat()">
    <button class="send" onclick="sendChat()">↵</button>
  </div>

</div>

<!-- ===== 策展后台弹窗 ===== -->
<div class="backend-overlay" id="backendOverlay">
  <div class="backend-header">
    <span class="bh-title">AI 博物馆 · 智能策展系统</span>
    <button class="bh-close" onclick="closeBackend()">✕ 返回导览</button>
  </div>
  <iframe class="backend-iframe" id="backendIframe"></iframe>
</div>

<script>
  var API_BASE = 'https://ai-agent-backend-j9qy.onrender.com';
  var isLoading = false;

  var chatArea = document.getElementById('chatArea');
  var chatInput = document.getElementById('chatInput');

  function addMsg(text, role) {
    var welcome = document.getElementById('welcomeMsg');
    if (welcome) welcome.style.display = 'none';
    var div = document.createElement('div');
    div.className = 'msg ' + role;
    var av = document.createElement('div');
    av.className = 'av';
    av.textContent = role === 'bot' ? '🤖' : '👤';
    var bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = text;
    div.appendChild(av);
    div.appendChild(bubble);
    chatArea.appendChild(div);
    chatArea.scrollTop = chatArea.scrollHeight;
  }

  function addTyping() {
    var div = document.createElement('div');
    div.className = 'msg bot';
    div.id = 'typingIndicator';
    div.innerHTML = '<div class="av">🤖</div><div class="bubble"><span style="display:inline-flex;gap:4px;"><span style="width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,0.4);animation:dotPulse 1.4s infinite"></span><span style="width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,0.4);animation:dotPulse 1.4s 0.2s infinite"></span><span style="width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,0.4);animation:dotPulse 1.4s 0.4s infinite"></span></span></div>';
    chatArea.appendChild(div);
    chatArea.scrollTop = chatArea.scrollHeight;
  }

  function removeTyping() {
    var el = document.getElementById('typingIndicator');
    if (el) el.remove();
  }

  async function callAIStream(text, onChunk) {
    var resp = await fetch(API_BASE + '/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'ark-code-latest',
        messages: [
          { role: 'system', content: '你是一位东莞市博物馆的AI数字人导览员，名叫"小莞"。你的任务是热情、专业地回答游客关于博物馆的各类问题，包括：镇馆之宝介绍、开放时间、预约方式、讲解服务、展览资讯、馆藏文物故事等。回答要亲切自然，用"您"尊称，适当使用emoji。如果不知道答案，诚实地告诉游客并建议他们咨询现场工作人员。不要编造不存在的展品或活动。' },
          { role: 'user', content: text }
        ],
        temperature: 0.7,
        max_tokens: 1000,
        stream: true
      })
    });
    if (!resp.ok) throw new Error('API Error: ' + resp.status);

    var reader = resp.body.getReader();
    var decoder = new TextDecoder();
    var fullText = '';
    var buffer = '';

    while (true) {
      var result = await reader.read();
      if (result.done) break;
      buffer += decoder.decode(result.value, { stream: true });
      var lines = buffer.split('\n');
      buffer = lines.pop() || '';
      for (var i = 0; i < lines.length; i++) {
        var line = lines[i].trim();
        if (!line || !line.startsWith('data: ')) continue;
        var data = line.slice(6);
        if (data === '[DONE]') continue;
        try {
          var parsed = JSON.parse(data);
          var content = parsed.choices?.[0]?.delta?.content || '';
          if (content) {
            fullText += content;
            onChunk(fullText);
          }
        } catch(e) {}
      }
    }
    return fullText;
  }

  function ask(q) {
    if (isLoading) return;
    addMsg(q, 'user');
    isLoading = true;
    chatInput.disabled = true;

    // Create bot message placeholder
    var div = document.createElement('div');
    div.className = 'msg bot';
    var av = document.createElement('div');
    av.className = 'av';
    av.textContent = '🤖';
    var bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = '<span style="display:inline-flex;gap:4px;"><span style="width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,0.4);animation:dotPulse 1.4s infinite"></span><span style="width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,0.4);animation:dotPulse 1.4s 0.2s infinite"></span><span style="width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,0.4);animation:dotPulse 1.4s 0.4s infinite"></span></span>';
    div.appendChild(av);
    div.appendChild(bubble);
    chatArea.appendChild(div);
    chatArea.scrollTop = chatArea.scrollHeight;

    callAIStream(q, function(text) {
      bubble.innerHTML = text.replace(/\n/g, '<br>');
      chatArea.scrollTop = chatArea.scrollHeight;
    }).catch(function() {
      bubble.innerHTML = '抱歉，我暂时无法回答，请稍后再试～';
    }).finally(function() {
      isLoading = false;
      chatInput.disabled = false;
      chatInput.focus();
    });
  }

  function sendChat() {
    var text = chatInput.value.trim();
    if (!text || isLoading) return;
    chatInput.value = '';
    ask(text);
  }

  function openBackend() {
    var overlay = document.getElementById('backendOverlay');
    var iframe = document.getElementById('backendIframe');
    overlay.classList.add('open');
    iframe.src = 'backend.html';
  }

  function closeBackend() {
    var overlay = document.getElementById('backendOverlay');
    var iframe = document.getElementById('backendIframe');
    overlay.classList.remove('open');
    iframe.src = '';
  }
</script>
</body>
</html>
